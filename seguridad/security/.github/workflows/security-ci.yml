name: Security & Isolation CI (i6-seguridad)
on:
  push:
    branches: [ i6-seguridad ]
  pull_request:
    branches: [ i6-seguridad ]
jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escáner 1 - SAST (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
      - name: Escáner 2 - Vulnerabilidades y Dependencias (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
      - name: Escáner 3 - Infraestructura como Código (KICS)
        uses: checkmarx/kics-github-action@master
        with:
          path: '.'
  isolation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar pruebas de aislamiento
        run: |
          chmod +x tests/isolation/run_isolation_tests.sh
          ./tests/isolation/run_isolation_tests.sh

---
# Deja lista la imagen del tenant. Lo ejecuta Packer dentro de la VM temporal.
# Orden: base -> nodejs -> mysql -> app -> firstboot
- name: Imagen del tenant (Mi-asistencia)
  hosts: all
  become: true
  vars:
    app_repo: https://github.com/escobarnina/Mi-asistencia.git
    app_ref: main
    app_version: "1.0.0"
  roles:
    - base
    - nodejs
    - mysql
    - app
    - firstboot

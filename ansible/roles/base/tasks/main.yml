---
- name: Zona horaria America/La_Paz
  ansible.builtin.command: timedatectl set-timezone America/La_Paz
  changed_when: true

- name: Paquetes base
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - openssl
      - acl   # permite a Ansible ejecutar tareas como otro usuario (become_user)
    state: present
    update_cache: true

- name: Archivo de swap de 1 GB (la t3.micro solo tiene 1 GB de RAM)
  ansible.builtin.shell: |
    fallocate -l 1G /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
  args:
    creates: /swapfile

- name: Swap permanente en /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

- name: Activar el swap durante el build
  ansible.builtin.command: swapon /swapfile
  register: base_swap
  failed_when: base_swap.rc != 0 and 'busy' not in base_swap.stderr
  changed_when: base_swap.rc == 0

---
- name: Repositorio de Node.js 20 (NodeSource)
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Instalar Node.js 20
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Comprobar la version de Node
  ansible.builtin.command: node --version
  register: nodejs_version
  changed_when: false
  failed_when: not nodejs_version.stdout.startswith('v20')

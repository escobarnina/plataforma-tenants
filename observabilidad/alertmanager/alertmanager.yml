global:
  resolve_timeout: 5m

route:
  group_by: ['tenant_id', 'alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'api-plataforma-webhook'

receivers:
  - name: 'api-plataforma-webhook'
    webhook_configs:
      # Envia las alertas a la API de la plataforma (RF-28 -> RF-29)
      - url: 'http://host.docker.internal:4000/alertas/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true
